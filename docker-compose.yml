services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-followme}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-followme}
      POSTGRES_DB: ${POSTGRES_DB:-followme}
    volumes:
      - pgdata_v2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-followme} -d $${POSTGRES_DB:-followme}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER:-followme}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-followme}
      - POSTGRES_DB=${POSTGRES_DB:-followme}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_DEVICE_SECRET=${JWT_DEVICE_SECRET}
      - JWT_ACCESS_EXPIRES_IN=${JWT_ACCESS_EXPIRES_IN:-15m}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN:-30d}
      - STORAGE_PATH=${STORAGE_PATH:-/data/recordings}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    volumes:
      - recordings:/data/recordings

volumes:
  pgdata_v2:
  recordings:
