services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ./backend/.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-followme} -d ${POSTGRES_DB:-followme}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - recordings:/data/recordings
    # No `ports:` here on purpose: Coolify's built-in Traefik proxy reaches
    # the container over its internal network and terminates TLS itself
    # (Let's Encrypt), so nothing should publish 80/443 directly - a
    # self-managed nginx/certbot would just conflict with it for those
    # ports. Declaring SERVICE_FQDN_<SERVICE>_<PORT> is Coolify's "magic"
    # env var convention: it tells Coolify's proxy to route that FQDN to
    # this service on port 3000 and to obtain/renew the TLS cert
    # automatically. Set the actual domain either by editing this value
    # or, simpler, by setting the "Domain" for this service in the
    # Coolify UI after first deploy (fm.tabloza.live) - Coolify then fills
    # this variable in for you.
    environment:
      - SERVICE_FQDN_BACKEND_3000=https://fm.tabloza.live

volumes:
  pgdata:
  recordings:
