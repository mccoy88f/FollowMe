# nginx reverse proxy for the FollowMe backend (fm.tabloza.live).
#
# First-time setup order (see nginx/README.md for full details):
#   1. Deploy with only the HTTP server block below active (as shipped).
#   2. Run certbot (via the `certbot` service in docker-compose.yml) to
#      obtain the certificate using the HTTP-01 webroot challenge served
#      by this same block.
#   3. Uncomment the HTTPS server block at the bottom of this file and
#      reload nginx (`docker compose exec nginx nginx -s reload`).

upstream followme_backend {
    server backend:3000;
}

server {
    listen 80;
    listen [::]:80;
    server_name fm.tabloza.live;

    # ACME HTTP-01 challenge files written by certbot.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Before a certificate exists, serve the API directly over HTTP so the
    # app is usable during initial setup. Once HTTPS is enabled below,
    # change this to a redirect instead:
    #   location / { return 301 https://$host$request_uri; }
    location / {
        proxy_pass http://followme_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        client_max_body_size 50m;
    }
}

